<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guichet-National</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bibliothèque QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <div class="max-w-xl mx-auto bg-slate-950 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
        <h1 class="text-2xl font-bold text-center text-emerald-400">Services-Citoyens.org</h1>
        <p class="text-sm text-center text-slate-400">Guichet Numérique de Demande d'Actes & Documents Officiels</p>

        <form id="documentForm" class="space-y-4">
            
            <!-- Type de Document -->
            <div>
                <label class="block text-xs text-slate-400 font-semibold mb-1">Type de Document Demandé</label>
                <select id="typeDocInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
                    <option value="Acte de Naissance">Acte de Naissance</option>
                    <option value="Attestation Officielle">Attestation Officielle</option>
                </select>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs text-slate-400 font-semibold mb-1">Adresse Email</label>
                <input type="email" id="emailInput" placeholder="citoyen@domaine.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
            </div>

            <!-- Nom -->
            <div>
                <label class="block text-xs text-slate-400 font-semibold mb-1">Nom</label>
                <input type="text" id="nomInput" placeholder="Nom" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
            </div>

            <!-- Postnom -->
            <div>
                <label class="block text-xs text-slate-400 font-semibold mb-1">Postnom</label>
                <input type="text" id="postnomInput" placeholder="Postnom" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
            </div>

            <!-- Prénom -->
            <div>
                <label class="block text-xs text-slate-400 font-semibold mb-1">Prénom</label>
                <input type="text" id="prenomInput" placeholder="Prénom" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
            </div>

            <!-- Date de Naissance -->
            <div>
                <label class="block text-xs text-slate-400 font-semibold mb-1">Date de Naissance</label>
                <input type="date" id="dateNaissanceInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
            </div>

            <!-- Secteur -->
            <div>
                <label class="block text-xs text-slate-400 font-semibold mb-1">Secteur</label>
                <input type="text" id="secteurInput" placeholder="Secteur" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
            </div>

            <!-- Province de Provenance -->
            <div>
                <label class="block text-xs text-slate-400 font-semibold mb-1">Province de Provenance</label>
                <input type="text" id="provinceInput" placeholder="Province" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
            </div>

            <!-- Adresse Résidentielle -->
            <div>
                <label class="block text-xs text-slate-400 font-semibold mb-1">Adresse Résidentielle</label>
                <input type="text" id="adresseresidentielleInput" placeholder="Adresse" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
            </div>

      <!-- MODE DE PAIEMENT DE LA TAXE -->
<div class="space-y-4 bg-slate-950 p-4 rounded-xl border border-slate-800">
    <label class="block text-xs text-slate-400 font-semibold uppercase tracking-wider">Mode de Paiement de la Taxe</label>
    
    <!-- Boutons de sélection rapide -->
    <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="setPaymentMode('M-Pesa')" class="py-2.5 px-3 bg-slate-900 hover:bg-emerald-600 border border-slate-700 rounded-lg text-xs font-semibold text-white transition-all text-center">
            M-Pesa
        </button>
        <button type="button" onclick="setPaymentMode('Orange Money')" class="py-2.5 px-3 bg-slate-900 hover:bg-emerald-600 border border-slate-700 rounded-lg text-xs font-semibold text-white transition-all text-center">
            Orange Money
        </button>
        <button type="button" onclick="setPaymentMode('Airtel Money')" class="py-2.5 px-3 bg-slate-900 hover:bg-emerald-600 border border-slate-700 rounded-lg text-xs font-semibold text-white transition-all text-center">
            Airtel Money
        </button>
        <button type="button" onclick="setPaymentMode('Carte Bancaire')" class="py-2.5 px-3 bg-slate-900 hover:bg-emerald-600 border border-slate-700 rounded-lg text-xs font-semibold text-white transition-all text-center">
            Carte Bancaire
        </button>
    </div>

    <!-- Conteneur dynamique pour la saisie (Mobile Money ou Carte) -->
    <div id="dynamicPaymentFields" class="space-y-3 pt-2">
        <div>
            <label class="block text-xs text-slate-400 font-semibold mb-1">Opérateur de Paiement</label>
            <input type="text" id="numeroPaiementInput" placeholder="+243..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white">
        </div>
    </div>
</div>

<!-- LE BOUTON DE VALIDATION (qui manquait) -->
<button type="button" id="btnValider" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition-all text-center mt-4">
    Valider et Générer le Document & QR Code
</button>

        <!-- Affichage du QR Code généré -->
        <div id="resultCard" class="space-y-4 pt-4 border-t border-slate-800 text-center">
            <h3 class="text-sm font-semibold text-slate-300">QR Code d'Authentification Officiel</h3>
            <div id="qrcode" class="flex justify-center p-4 bg-white rounded-xl inline-block"></div>
        </div>

    </div>

    <!-- Script de configuration Supabase global (initialisation de supabaseClient) -->
    <script src="supabase-config.js"></script>
    <!-- Script principal de génération -->
    <script src="generateurs.js"></script>
</body>
</html>
